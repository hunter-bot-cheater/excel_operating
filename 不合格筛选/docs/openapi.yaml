openapi: 3.0.3
info: {title: 不合格筛选 API, version: 0.1.0}
paths:
  /api/v1/nonconforming/screen:
    post:
      summary: 上传并提交不合格筛选任务
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {type: object, required: [files], properties: {files: {type: array, items: {type: string, format: binary}}}}}}
      responses: {'200': {description: 已接收}}
  /api/v1/nonconforming/tasks/{task_id}:
    get:
      parameters: [{name: task_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 任务状态}, '404': {description: 不存在}}
  /api/v1/nonconforming/tasks/{task_id}/downloads/{filename}:
    get:
      parameters: [{name: task_id, in: path, required: true, schema: {type: string}}, {name: filename, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 文件流}}
